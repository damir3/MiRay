<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="none" stroke="#a0a0a0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top-Left: Horizontal Hatching -->
  <rect x="1.5" y="1.5" width="9" height="9" rx="1" ry="1"/>
  <line x1="2" y1="4" x2="10" y2="4"/>
  <line x1="2" y1="6" x2="10" y2="6"/>
  <line x1="2" y1="8" x2="10" y2="8"/>

  <!-- Top-Right: Diagonal Hatching (/) -->
  <rect x="13.5" y="1.5" width="9" height="9" rx="1" ry="1"/>
  <line x1="14" y1="4" x2="16" y2="2"/>
  <line x1="14" y1="7" x2="19" y2="2"/>
  <line x1="14" y1="10" x2="22" y2="2"/>
  <line x1="17" y1="10" x2="22" y2="5"/>
  <line x1="20" y1="10" x2="22" y2="8"/>

  <!-- Bottom-Left: Diagonal Hatching (\) -->
  <rect x="1.5" y="13.5" width="9" height="9" rx="1" ry="1"/>
  <line x1="2" y1="20" x2="4" y2="22"/>
  <line x1="2" y1="17" x2="7" y2="22"/>
  <line x1="2" y1="14" x2="10" y2="22"/>
  <line x1="5" y1="14" x2="10" y2="19"/>
  <line x1="8" y1="14" x2="10" y2="16"/>

  <!-- Bottom-Right: Vertical Hatching -->
  <rect x="13.5" y="13.5" width="9" height="9" rx="1" ry="1"/>
  <line x1="16" y1="14" x2="16" y2="22"/>
  <line x1="18" y1="14" x2="18" y2="22"/>
  <line x1="20" y1="14" x2="20" y2="22"/>
</svg>
