<svg xmlns="http://www.w3.org/2000/svg" height="256px" viewBox="0 0 256 256" width="256px">
  <defs>
    <pattern id="checkerboard" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e8e8e8"/>
      <rect x="16" width="16" height="16" fill="#d8d8d8"/>
      <rect y="16" width="16" height="16" fill="#d8d8d8"/>
      <rect x="16" y="16" width="16" height="16" fill="#e8e8e8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#f0f0f0"/>
  
  <!-- Outer Circle with Checkerboard Fill -->
  <circle cx="128" cy="128" r="117" fill="url(#checkerboard)" stroke="#808080" stroke-width="16"/>
  
  <!-- Centered Text (y adjusted to 138 for perfect vertical centering in Qt/all renderers) -->
  <text x="128" y="138" fill="#808080" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="bold" text-anchor="middle" letter-spacing="0.5px">NO PREVIEW</text>
</svg>