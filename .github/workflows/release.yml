name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/update (e.g. v2.0.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-and-bundle:
    name: Build & Bundle (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS ARM64
            os: macos-14
            arch: arm
            profile: conan/mac-arm
            test_cmd: ./bin/arm/Core.Tests
          - name: Windows x64
            os: windows-2022
            arch: 64
            profile: conan/win-x64
            test_cmd: ./bin/64/Core.Tests.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan 2
        shell: bash
        run: |
          pip install "conan>=2.0"
          conan profile detect --force

      - name: Register Local Conan Recipes Remote
        shell: bash
        run: |
          conan remote add shared ./conan -t local-recipes-index -f || conan remote add shared conan -t local-recipes-index -f || true

      - name: Restore / Save Conan Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2/p
            C:\Users\runneradmin\.conan2\p
          key: conan-${{ matrix.platform.name }}-${{ hashFiles('conanfile.py', 'conan/**') }}
          restore-keys: |
            conan-${{ matrix.platform.name }}-

      - name: Install Conan Dependencies
        shell: bash
        run: |
          conan install . \
            --build=missing \
            -pr:h=${{ matrix.platform.profile }} \
            -pr:b=default \
            -s build_type=RelWithDebInfo \
            --core-conf="core.package_id:default_non_embed_mode=full_mode"

      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B tmp -G Xcode \
              -DCMAKE_TOOLCHAIN_FILE=tmp/conan_toolchain.cmake
          else
            cmake -B tmp -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_TOOLCHAIN_FILE=tmp/conan_toolchain.cmake
          fi

      - name: Build All Targets
        shell: bash
        run: |
          cmake --build tmp --config RelWithDebInfo -j

      - name: Run Unit Tests
        shell: bash
        run: |
          ${{ matrix.platform.test_cmd }}

      - name: (macOS) Setup Keychain & Import Certificate
        if: runner.os == 'macOS' && env.HAVE_CERT == 'true'
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD="temporary_password"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: (macOS) Bundle, Sign & Notarize
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # 1. Prepare application bundle
          bash tools/mac/bundle.sh ${{ matrix.platform.arch }}

          # 2. Code sign if certificate identity is available
          if [ -n "${DEVELOPER_ID}" ]; then
            echo "==> Signing application with: ${DEVELOPER_ID}..."
            bash tools/mac/sign.sh ${{ matrix.platform.arch }}
          else
            echo "==> DEVELOPER_ID secret not set, skipping code signing."
          fi

          # 3. Notarize if Apple API credentials are available
          if [ -n "${APPLE_API_KEY_BASE64}" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ]; then
            echo "==> Submitting bundle to Apple for notarization..."
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}"

            NOTARIZE_ZIP="$RUNNER_TEMP/notarize_${{ matrix.platform.arch }}.zip"
            ditto -c -k --keepParent "bin/${{ matrix.platform.arch }}/MiRay.app" "${NOTARIZE_ZIP}"

            xcrun notarytool submit "${NOTARIZE_ZIP}" \
              --key "${API_KEY_PATH}" \
              --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER}" \
              --wait

            echo "==> Stapling notarization ticket to MiRay.app..."
            xcrun stapler staple "bin/${{ matrix.platform.arch }}/MiRay.app"

            echo "==> Verifying stapled ticket..."
            spctl --assess --type execute --verbose "bin/${{ matrix.platform.arch }}/MiRay.app" || true
          else
            echo "==> Apple API credentials not set, skipping notarization."
          fi

          # 4. Create final distribution ZIP with stapled ticket and preserved symlinks
          mkdir -p out
          ditto -c -k --keepParent "bin/${{ matrix.platform.arch }}/MiRay.app" "out/MiRay-macOS-${{ matrix.platform.arch }}.zip"

      - name: (Windows) Bundle Application
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\win\bundle.cmd ${{ matrix.platform.arch }}
          if not exist out mkdir out
          7z a -tzip out\MiRay-Windows-${{ matrix.platform.arch }}.zip .\bin\${{ matrix.platform.arch }}\* -xr!Core.Tests* -xr!*.pdb -xr!*.ilk

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiRay-${{ matrix.platform.name }}
          path: out/*

  publish-release:
    name: Publish GitHub Release
    needs: build-and-bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: out-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'latest' }}
          files: out-release/*
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
