name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-bundle:
    name: Build & Bundle (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS ARM64
            os: macos-14
            arch: arm
            profile: conan/mac-arm
            test_cmd: ./bin/arm/Core.Tests
          - name: Windows x64
            os: windows-2022
            arch: 64
            profile: conan/win-x64
            test_cmd: ./bin/64/Core.Tests.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan 2
        shell: bash
        run: |
          pip install "conan>=2.0"
          conan profile detect --force

      - name: Register Local Conan Recipes Remote
        shell: bash
        run: |
          conan remote add shared ./conan -t local-recipes-index -f || conan remote add shared conan -t local-recipes-index -f || true

      - name: Restore / Save Conan Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2/p
            C:\Users\runneradmin\.conan2\p
          key: conan-${{ matrix.platform.name }}-${{ hashFiles('conanfile.py', 'conan/**') }}
          restore-keys: |
            conan-${{ matrix.platform.name }}-

      - name: Install Conan Dependencies
        shell: bash
        run: |
          conan install . \
            --build=missing \
            -pr:h=${{ matrix.platform.profile }} \
            -pr:b=default \
            -s build_type=RelWithDebInfo \
            --core-conf="core.package_id:default_non_embed_mode=full_mode"

      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B tmp -G Xcode \
              -DCMAKE_TOOLCHAIN_FILE=tmp/conan_toolchain.cmake
          else
            cmake -B tmp -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_TOOLCHAIN_FILE=tmp/conan_toolchain.cmake
          fi

      - name: Build All Targets
        shell: bash
        run: |
          cmake --build tmp --config RelWithDebInfo -j

      - name: Run Unit Tests
        shell: bash
        run: |
          ${{ matrix.platform.test_cmd }}

      - name: (macOS) Bundle Application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash tools/mac/bundle.sh ${{ matrix.platform.arch }}
          mkdir -p out
          ditto -c -k --keepParent bin/${{ matrix.platform.arch }}/MiRay.app out/MiRay-macOS-${{ matrix.platform.arch }}.zip

      - name: (Windows) Bundle Application
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\win\bundle.cmd ${{ matrix.platform.arch }}
          if not exist out mkdir out
          7z a -tzip out\MiRay-Windows-${{ matrix.platform.arch }}.zip .\bin\${{ matrix.platform.arch }}\* -xr!Core.Tests* -xr!*.pdb -xr!*.ilk

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiRay-${{ matrix.platform.name }}
          path: out/*

  publish-release:
    name: Publish GitHub Release
    needs: build-and-bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: out-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
